<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NoteFlow AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Brand Header ─────────────────────────────────────────────────────── -->
  <header class="app-header">
    <span class="brand-logo">
      <img id="brandLogoImg" class="brand-logo-img"
        src="https://ashwanitiwari.com/logo.png" alt="" />
      <svg id="brandLogoFallback" class="brand-logo-fallback hidden"
        viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="36" height="36" rx="9" fill="url(#g1)" />
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#2563eb"/>
            <stop offset="100%" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
        <text x="18" y="24" text-anchor="middle"
          font-family="-apple-system,Segoe UI,sans-serif"
          font-size="13" font-weight="800" fill="#fff">NF</text>
      </svg>
    </span>
    <div class="header-text">
      <span class="app-title">NoteFlow AI</span>
      <span class="app-sub" id="headerSub">Smart Web Summarizer</span>
    </div>
    <div class="header-stat">
      <span class="stat-num" id="headerNoteCount">—</span>
      <span class="stat-lbl">notes</span>
    </div>
  </header>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main>

    <!-- Provider picker -->
    <div class="field">
      <label class="field-label">AI Provider</label>
      <div class="select-wrap">
        <select id="aiProvider">
          <option value="gemini-web">Gemini Web</option>
          <option value="chatgpt-web">ChatGPT Web</option>
          <option value="claude-web">Claude Web</option>
          <option value="perplexity-web">Perplexity AI</option>
          <option value="deepseek-web">DeepSeek Web</option>
        </select>
      </div>
      <div id="sessionChip" class="session-chip detecting">
        <span class="chip-dot"></span>
        <span id="sessionChipText">Detecting sessions…</span>
      </div>
    </div>

    <!-- Topic override -->
    <div class="field">
      <label class="field-label">
        Topic title
        <span class="field-hint">optional</span>
      </label>
      <input type="text" id="topicOverride"
        placeholder="Leave blank — AI decides" />
    </div>

    <!-- Primary action -->
    <button id="scanBtn" class="scan-btn">
      <svg class="scan-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="10" cy="10" r="3"/>
        <path d="M10 1v3M10 16v3M1 10h3M16 10h3M3.22 3.22l2.12 2.12M14.66 14.66l2.12 2.12M16.78 3.22l-2.12 2.12M5.34 14.66l-2.12 2.12"/>
      </svg>
      Capture Page Notes
    </button>

    <!-- Status -->
    <div id="statusBadge" class="status-badge idle">Ready</div>
    <div id="errorBox" class="error-box hidden"></div>

    <div class="divider"></div>

    <!-- Secondary actions -->
    <div class="action-row">
      <button id="openViewerBtn" class="action-btn">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="2" y="3" width="14" height="12" rx="2"/>
          <path d="M6 7h6M6 10h4"/>
        </svg>
        Dashboard
      </button>
      <button id="clearNotesBtn" class="action-btn action-btn--warn">
        <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 5h12M8 5V3h2v2M7 8v5M11 8v5M4 5l1 10h8l1-10"/>
        </svg>
        Clear All
      </button>
    </div>

    <!-- Confirm dialog -->
    <div id="clearConfirm" class="confirm-box hidden">
      <p class="confirm-text">Delete all notes? This can't be undone.</p>
      <div class="confirm-row">
        <button id="clearConfirmYes" class="confirm-yes">Delete all</button>
        <button id="clearConfirmNo" class="confirm-no">Cancel</button>
      </div>
    </div>

  </main>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    <a href="https://ashwanitiwari.com" target="_blank" rel="noopener" class="footer-link">
      ashwanitiwari.com
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
