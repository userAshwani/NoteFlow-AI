<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NoteFlow AI</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Brand Header ─────────────────────────────────────────────────────── -->
  <header class="app-header">
    <div class="brand-group">
      <span class="brand-logo">
        <img id="brandLogoImg" class="brand-logo-img" src="https://ashwanitiwari.com/logo.png" alt="NF" />
        <div id="brandLogoFallback" class="brand-logo-fallback hidden">NF</div>
      </span>
      <div class="header-text">
        <div class="title-row">
          <span class="app-title">NoteFlow AI</span>
          <span class="version-badge">PRO</span>
        </div>
        <span class="app-sub" id="headerSub">Smart Web Summarizer</span>
      </div>
    </div>

    <div class="header-stat">
      <span class="stat-num" id="headerNoteCount">0</span>
      <span class="stat-lbl">Notes</span>
    </div>
  </header>

  <!-- ── Main Form ─────────────────────────────────────────────────────────── -->
  <main class="popup-body">

    <!-- AI Model Selector -->
    <div class="field-item">
      <div class="field-label-row">
        <label class="field-label">AI Engine</label>
        <span id="sessionStatusBadge" class="session-badge active">
          <span class="session-pulse"></span>
          <span id="sessionChipText">Detecting…</span>
        </span>
      </div>
      <div class="select-container">
        <select id="aiProvider">
          <option value="gemini-web">Gemini Web</option>
          <option value="chatgpt-web">ChatGPT Web</option>
          <option value="claude-web">Claude Web</option>
          <option value="perplexity-web">Perplexity AI</option>
          <option value="deepseek-web">DeepSeek Web</option>
        </select>
      </div>
    </div>

    <!-- Optional Custom Title Override -->
    <div class="field-item">
      <div class="field-label-row">
        <label class="field-label" for="topicOverride">Custom Topic Title</label>
        <span class="field-hint">optional</span>
      </div>
      <input type="text" id="topicOverride" class="text-input" placeholder="Leave blank — AI will generate" autocomplete="off" />
    </div>

    <!-- Main Capture CTA -->
    <button id="scanBtn" class="primary-capture-btn">
      <svg class="capture-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="10" cy="10" r="3"/>
        <path d="M10 2v3M10 15v3M2 10h3M15 10h3M4.34 4.34l2.12 2.12M13.54 13.54l2.12 2.12M15.66 4.34l-2.12 2.12M6.46 13.54l-2.12 2.12"/>
      </svg>
      <span>Capture Page Notes</span>
    </button>

    <!-- Real-time Status -->
    <div id="statusBadge" class="process-badge idle">Ready</div>
    <div id="errorBox" class="error-banner hidden"></div>

    <div class="divider-line"></div>

    <!-- Secondary Links -->
    <div class="actions-grid">
      <button id="openViewerBtn" class="sub-action-btn">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="14" height="12" rx="2"/>
          <path d="M7 8h6M7 12h4"/>
        </svg>
        <span>Dashboard</span>
      </button>
      <button id="clearNotesBtn" class="sub-action-btn sub-action-btn--warn">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 6h12M8 6V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v2M5 6l1 11a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-11"/>
        </svg>
        <span>Clear Notes</span>
      </button>
    </div>

    <!-- Inline Confirm Box -->
    <div id="clearConfirm" class="confirm-inline-box hidden">
      <span class="confirm-msg">Delete all saved notes from dashboard?</span>
      <div class="confirm-buttons-row">
        <button id="clearConfirmYes" class="btn-clear-yes">Delete All</button>
        <button id="clearConfirmNo" class="btn-clear-no">Cancel</button>
      </div>
    </div>

  </main>

  <!-- ── Footer ───────────────────────────────────────────────────────────── -->
  <footer class="app-footer">
    <a href="https://ashwanitiwari.com" target="_blank" rel="noopener" class="footer-link">
      ashwanitiwari.com
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
